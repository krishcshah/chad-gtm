<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimal Squircle Housing -->
  <rect width="512" height="512" rx="128" fill="#121214" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#27272a" stroke-width="16" />

  <!-- Subtle Dial Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="14" />

  <!-- Dual-tone Compass Needle -->
  <!-- North (Pure White & Silver) -->
  <polygon points="256,76 256,256 180,256" fill="#ffffff" />
  <polygon points="256,76 332,256 256,256" fill="#a1a1aa" />

  <!-- South (Deep Steel Facets) -->
  <polygon points="256,436 256,256 180,256" fill="#52525b" />
  <polygon points="256,436 332,256 256,256" fill="#27272a" />

  <!-- Center Jewel Hub -->
  <circle cx="256" cy="256" r="36" fill="#121214" stroke="#ffffff" stroke-width="16" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
