<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#07090e" rx="112" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#27272a" stroke-width="6" />
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="180" fill="#09090b" stroke="#3f3f46" stroke-width="8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#27272a" stroke-width="4" stroke-dasharray="8 12" />
  
  <!-- Cardinal Tick Markers -->
  <line x1="256" y1="84" x2="256" y2="124" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="388" x2="256" y2="428" stroke="#52525b" stroke-width="8" stroke-linecap="round" />
  <line x1="84" y1="256" x2="124" y2="256" stroke="#52525b" stroke-width="8" stroke-linecap="round" />
  <line x1="388" y1="256" x2="428" y2="256" stroke="#52525b" stroke-width="8" stroke-linecap="round" />
  
  <!-- Sub-cardinal Ticks (NE, NW, SE, SW) -->
  <line x1="148" y1="148" x2="174" y2="174" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" />
  <line x1="364" y1="148" x2="338" y2="174" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" />
  <line x1="148" y1="364" x2="174" y2="338" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" />
  <line x1="364" y1="364" x2="338" y2="338" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" />

  <!-- Multi-faceted Precision Needle -->
  <!-- North Needle Facets (Bright High-Contrast) -->
  <polygon points="256,108 296,256 256,226" fill="#ffffff" />
  <polygon points="256,108 216,256 256,226" fill="#a1a1aa" />

  <!-- South Needle Facets (Subtle Dark Zinc) -->
  <polygon points="256,404 296,256 256,286" fill="#52525b" />
  <polygon points="256,404 216,256 256,286" fill="#27272a" />

  <!-- Center Jewel / Hub -->
  <circle cx="256" cy="256" r="32" fill="#09090b" stroke="#ffffff" stroke-width="8" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
